name: Build BBS FS for Forge 1.12.2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - name: Build with retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            rm -rf ~/.gradle/caches/retro_futura_gradle
            if ./gradlew clean build --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying..."
              sleep 15
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: bbs-fs-forge-1.12.2
          path: build/libs/bbs-fs-2.8-1.12.2-alpha.1.jar
