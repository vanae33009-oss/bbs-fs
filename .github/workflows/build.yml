name: Build BBS FS for Forge 1.12.2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bbs-fs-forge-1.12.2
          path: build/libs/bbs-fs-2.8-1.12.2-alpha.1.jar
